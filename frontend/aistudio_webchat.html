<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Webchat — AE Agentic Support</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #0d47a1, #1565c0);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .header .status {
      font-size: 12px;
      opacity: .85;
      margin-left: auto;
    }

    .header .navlink {
      color: #fff;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, .45);
      padding: 5px 9px;
      border-radius: 12px;
      margin-left: 10px;
    }

    .header .navlink:hover {
      background: rgba(255, 255, 255, .15);
    }

    .header .info {
      font-size: 11px;
      opacity: .6;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 14px;
      word-wrap: break-word;
      animation: fadeIn .25s ease;
    }

    .msg.bot {
      background: white;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .msg.user {
      background: #1565c0;
      color: white;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .msg.system {
      background: transparent;
      color: #888;
      font-size: 12px;
      text-align: center;
      align-self: center;
    }

    .msg.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      align-self: center;
      font-size: 13px;
    }
    
    /* Markdown Styles */
    .msg.bot h1, .msg.bot h2, .msg.bot h3 { margin: 12px 0 8px; font-weight: 600; line-height: 1.3; }
    .msg.bot h1 { font-size: 1.25em; }
    .msg.bot h2 { font-size: 1.15em; }
    .msg.bot h3 { font-size: 1.05em; }
    .msg.bot p { margin-bottom: 8px; }
    .msg.bot ul, .msg.bot ol { margin: 8px 0 8px 20px; }
    .msg.bot li { margin-bottom: 4px; }
    .msg.bot code { background: #f3f4f6; padding: 2px 4px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 0.9em; color: #d63384; }
    .msg.bot pre { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 12px 0; font-family: 'Consolas', monospace; font-size: 0.85em; }
    .msg.bot pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
    .msg.bot table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9em; }
    .msg.bot th, .msg.bot td { border: 1px solid #e5e7eb; padding: 8px 12px; text-align: left; }
    .msg.bot th { background: #f9fafb; font-weight: 600; }
    .msg.bot blockquote { border-left: 4px solid #3b82f6; padding-left: 12px; font-style: italic; color: #4b5563; margin: 12px 0; }
    .msg.bot a { color: #1565c0; text-decoration: underline; }
    .msg.bot img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
    .msg.bot .bot-card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #dbe5f4;
      border-radius: 12px;
      background: #f8fbff;
    }
    .msg.bot .bot-card:first-child { margin-top: 0; }
    .msg.bot .bot-card-title {
      font-weight: 600;
      margin-bottom: 10px;
      color: #0d47a1;
    }
    .msg.bot .bot-card-text {
      white-space: pre-wrap;
      margin-bottom: 8px;
    }
    .msg.bot .bot-card-facts {
      display: grid;
      grid-template-columns: minmax(110px, auto) 1fr;
      gap: 8px 12px;
      margin-top: 10px;
    }
    .msg.bot .bot-card-facts dt {
      font-weight: 600;
      color: #334155;
    }
    .msg.bot .bot-card-facts dd {
      margin: 0;
      color: #0f172a;
      word-break: break-word;
    }
    .msg.bot .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .msg.bot .card-action-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: #1565c0;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .msg.bot .card-action-btn.destructive {
      background: #c62828;
    }
    .msg.bot .card-action-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .msg .label {
      font-size: 11px;
      font-weight: 600;
      opacity: .5;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .typing {
      align-self: flex-start;
      padding: 14px 22px;
      background: white;
      border-radius: 16px;
      display: none;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .typing span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #bbb;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce .6s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    .input-area {
      padding: 16px 24px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 12px;
    }

    .input-area select {
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      background: white;
      font-size: 13px;
      color: #333;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .input-area input:focus {
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, .15);
    }

    .input-area button {
      padding: 12px 28px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }

    .input-area button:hover {
      background: #0d47a1;
    }

    .input-area button:active {
      transform: scale(.97);
    }

    .input-area button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .quick-actions {
      padding: 8px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-actions button {
      padding: 6px 14px;
      border: 1.5px solid #1565c0;
      background: white;
      color: #1565c0;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
    }

    .quick-actions button:hover {
      background: #1565c0;
      color: white;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-6px);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="dot" id="statusDot" style="background:#ffc107"></div>
    <div>
      <h1 id="chatTitle">AI Studio Agentic Ops Support</h1>
      <div class="info" id="convInfo">Connecting to Cognibot via WebSocket...</div>
    </div>
    <span class="status" id="statusText">Connecting...</span>
    <a class="navlink" href="/admin">Control Center</a>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
  <div class="quick-actions" id="quickActions"></div>
  <div class="input-area">
    <select id="roleSelect" title="Audience role">
      <option value="technical" selected>Technical</option>
      <option value="business">Business</option>
    </select>
    <input type="text" id="msgInput" placeholder="Describe your issue..." disabled>
    <button id="sendBtn" disabled onclick="sendMessage()">Send</button>
  </div>

  <script>
    const DEFAULT_UI = {
      assistantName: 'AutomationEdge Ops Agent',
      technicalRoleLabel: 'Technical',
      businessRoleLabel: 'Business',
      inputPlaceholder: 'Describe your issue...',
      technicalWelcomeMessage: 'Connected to AI Studio. Share the workflow, symptom, or request you want investigated.',
      businessWelcomeMessage: 'Connected to AI Studio. Tell me what business issue is blocked and I will guide you in plain language.',
      quickActions: [
        'Check system health and agent status',
        'Which workflows are having issues?',
        'Analyze the latest workflow failure',
        'Create a support ticket'
      ],
      aistudioConfigured: true
    };
    let chatUi = { ...DEFAULT_UI };
    let conversationId = null;
    let streamUrl = '';
    let ws = null;
    let reconnectTimer = null;

    const chatArea = document.getElementById('chatArea');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const roleSel = document.getElementById('roleSelect');
    const typingEl = document.getElementById('typing');
    const statusDot = document.getElementById('statusDot');
    const statusTxt = document.getElementById('statusText');
    const convInfo = document.getElementById('convInfo');
    const titleEl = document.getElementById('chatTitle');
    const quickActionsEl = document.getElementById('quickActions');

    function parseStructuredPayload(payload) {
      if (payload && typeof payload === 'object' && !Array.isArray(payload)) {
        return payload;
      }
      if (typeof payload !== 'string') return null;
      const trimmed = payload.trim();
      if (!trimmed || (!trimmed.startsWith('{') && !trimmed.startsWith('['))) {
        return null;
      }
      try {
        const parsed = JSON.parse(trimmed);
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null;
      } catch (_err) {
        return null;
      }
    }

    function payloadText(payload) {
      if (typeof payload === 'string') return payload;
      if (payload && typeof payload.text === 'string') return payload.text;
      return '';
    }

    function payloadAttachments(payload) {
      return payload && Array.isArray(payload.attachments) ? payload.attachments : [];
    }

    function renderFactSet(container, facts) {
      if (!Array.isArray(facts) || !facts.length) return;
      const factList = document.createElement('dl');
      factList.className = 'bot-card-facts';
      facts.forEach((fact) => {
        if (!fact || typeof fact !== 'object') return;
        const dt = document.createElement('dt');
        dt.textContent = fact.title || '';
        const dd = document.createElement('dd');
        dd.textContent = fact.value || '';
        factList.appendChild(dt);
        factList.appendChild(dd);
      });
      container.appendChild(factList);
    }

    function createBaseActivity(overrides = {}) {
      return {
        type: 'message',
        from: { id: 'webchat_user', name: 'Webchat User' },
        channelId: 'webchat',
        user_type: roleSel.value || 'technical',
        channelData: { user_role: roleSel.value || 'technical' },
        ...overrides,
      };
    }

    async function postActivity(activity, userEcho) {
      if (!conversationId) return false;
      const echoText = (typeof userEcho === 'string' && userEcho.trim())
        ? userEcho
        : (activity && typeof activity.text === 'string' && activity.text.trim())
          ? activity.text
          : 'Submitted action';

      addMsg(echoText, 'user', 'You');
      sendBtn.disabled = true;
      msgInput.disabled = true;
      typingEl.style.display = 'block';
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        const r = await fetch('/api/aistudio/conversations/' + encodeURIComponent(conversationId) + '/activities', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(activity),
        });
        if (!r.ok) {
          typingEl.style.display = 'none';
          addMsg('Failed to send: HTTP ' + r.status, 'error');
          sendBtn.disabled = false;
          msgInput.disabled = false;
          return false;
        }
        return true;
      } catch (e) {
        typingEl.style.display = 'none';
        addMsg('Send failed: ' + e.message, 'error');
        sendBtn.disabled = false;
        msgInput.disabled = false;
        return false;
      }
    }

    async function submitCardAction(actionData, title, buttonEl) {
      const data = actionData && typeof actionData === 'object' ? { ...actionData } : {};
      const actionText = String(data.action || title || 'submit').trim();
      if (!actionText) return;
      if (buttonEl) buttonEl.disabled = true;
      const sent = await postActivity(
        createBaseActivity({ text: actionText, value: data }),
        title || actionText
      );
      if (!sent && buttonEl) buttonEl.disabled = false;
    }

    function renderAdaptiveCardAttachment(container, attachment) {
      const card = attachment && attachment.content && typeof attachment.content === 'object'
        ? attachment.content
        : {};
      const cardEl = document.createElement('div');
      cardEl.className = 'bot-card';

      if (Array.isArray(card.body)) {
        card.body.forEach((item) => {
          if (!item || typeof item !== 'object') return;
          if (item.type === 'TextBlock') {
            const block = document.createElement('div');
            block.className = item.weight === 'Bolder' || item.size === 'Medium'
              ? 'bot-card-title'
              : 'bot-card-text';
            block.textContent = item.text || '';
            cardEl.appendChild(block);
            return;
          }
          if (item.type === 'FactSet') {
            renderFactSet(cardEl, item.facts);
            return;
          }
          if (typeof item.text === 'string' && item.text) {
            const block = document.createElement('div');
            block.className = 'bot-card-text';
            block.textContent = item.text;
            cardEl.appendChild(block);
          }
        });
      }

      if (Array.isArray(card.actions) && card.actions.length) {
        const actionsEl = document.createElement('div');
        actionsEl.className = 'card-actions';
        card.actions.forEach((action) => {
          if (!action || action.type !== 'Action.Submit') return;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card-action-btn' + (action.style === 'destructive' ? ' destructive' : '');
          btn.textContent = action.title || String((action.data || {}).action || 'Submit');
          btn.onclick = () => submitCardAction(action.data || {}, btn.textContent, btn);
          actionsEl.appendChild(btn);
        });
        if (actionsEl.childElementCount) {
          cardEl.appendChild(actionsEl);
        }
      }

      if (!cardEl.childElementCount) {
        const fallback = document.createElement('div');
        fallback.className = 'bot-card-text';
        fallback.textContent = payloadText(card) || 'Card content received.';
        cardEl.appendChild(fallback);
      }

      container.appendChild(cardEl);
    }

    function renderBotPayload(container, payload) {
      const structured = parseStructuredPayload(payload);
      const text = payloadText(structured || payload);
      const attachments = payloadAttachments(structured);

      if (text) {
        const textEl = document.createElement('div');
        textEl.innerHTML = marked.parse(text);
        container.appendChild(textEl);
      }

      attachments.forEach((attachment) => {
        if (!attachment || typeof attachment !== 'object') return;
        if (attachment.contentType === 'application/vnd.microsoft.card.adaptive') {
          renderAdaptiveCardAttachment(container, attachment);
          return;
        }

        const fallback = document.createElement('pre');
        fallback.className = 'bot-card';
        fallback.textContent = JSON.stringify(attachment, null, 2);
        container.appendChild(fallback);
      });

      if (!text && !attachments.length) {
        if (structured) {
          const fallback = document.createElement('pre');
          fallback.className = 'bot-card';
          fallback.textContent = JSON.stringify(structured, null, 2);
          container.appendChild(fallback);
          return;
        }
        container.innerHTML = marked.parse(String(payload || ''));
      }
    }

    function addMsg(payload, cls, label) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      if (label) {
        const l = document.createElement('div');
        l.className = 'label';
        l.textContent = label;
        d.appendChild(l);
      }
      const t = document.createElement('div');
      t.className = 'content';
      if (cls.includes('bot')) {
        renderBotPayload(t, payload);
      } else {
        // Plain text for user (preserve spaces/newlines)
        t.textContent = String(payload || '');
        t.style.whiteSpace = 'pre-wrap';
      }
      d.appendChild(t);
      chatArea.appendChild(d);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function renderQuickActions() {
      quickActionsEl.innerHTML = '';
      (chatUi.quickActions || []).forEach((text) => {
        const btn = document.createElement('button');
        btn.textContent = text.length > 28 ? text.slice(0, 28) + '...' : text;
        btn.onclick = () => sendQuick(text);
        quickActionsEl.appendChild(btn);
      });
    }

    function applyChatUi() {
      titleEl.textContent = chatUi.assistantName || DEFAULT_UI.assistantName;
      msgInput.placeholder = chatUi.inputPlaceholder || DEFAULT_UI.inputPlaceholder;
      roleSel.innerHTML = '';
      [
        ['technical', chatUi.technicalRoleLabel || DEFAULT_UI.technicalRoleLabel],
        ['business', chatUi.businessRoleLabel || DEFAULT_UI.businessRoleLabel]
      ].forEach(([value, label], index) => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        if (index === 0) opt.selected = true;
        roleSel.appendChild(opt);
      });
      renderQuickActions();
    }

    async function loadChatUi() {
      try {
        const r = await fetch('/api/ui-config/chat', { signal: AbortSignal.timeout(4000) });
        if (!r.ok) return;
        const payload = await r.json();
        chatUi = { ...DEFAULT_UI, ...(payload || {}) };
      } catch (e) { }
      applyChatUi();
    }

    function assistantLabel() {
      return chatUi.assistantName || DEFAULT_UI.assistantName;
    }

    function currentWelcome() {
      return roleSel.value === 'business'
        ? (chatUi.businessWelcomeMessage || DEFAULT_UI.businessWelcomeMessage)
        : (chatUi.technicalWelcomeMessage || DEFAULT_UI.technicalWelcomeMessage);
    }

    function setStatus(state) {
      const colors = { ok: '#4caf50', warn: '#ffc107', err: '#f44336' };
      const labels = { ok: 'Connected via WebSocket', warn: 'Connecting...', err: 'Disconnected' };
      statusDot.style.background = colors[state];
      statusTxt.textContent = labels[state];
      const ready = state === 'ok';
      msgInput.disabled = !ready;
      sendBtn.disabled = !ready;
    }

    async function startConversation() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      try {
        setStatus('warn');
        const r = await fetch('/api/aistudio/conversations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: 'webchat_user', user_name: 'Webchat User' }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
        if (!data.conversationId) throw new Error('No conversation ID was returned.');
        if (!data.webSocketUrl && !data.streamUrl) {
          throw new Error('No WebSocket stream was returned by the server.');
        }
        conversationId = data.conversationId;
        streamUrl = data.webSocketUrl || data.streamUrl || '';
        convInfo.textContent = 'Conversation: ' + conversationId;
        connectWebSocket(streamUrl);
      } catch (e) {
        console.error('Failed to start conversation:', e);
        setStatus('err');
        addMsg('Cannot connect to Cognibot. Error: ' + e.message, 'error');
        reconnectTimer = setTimeout(startConversation, 5000);
      }
    }

    function connectWebSocket(nextStreamUrl) {
      if (!nextStreamUrl) {
        startConversation();
        return;
      }
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      ws = new WebSocket(nextStreamUrl);

      ws.onopen = () => {
        console.log('WebSocket connected');
        setStatus('ok');
        addMsg(currentWelcome(), 'bot', assistantLabel());
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log('WS full:', JSON.stringify(data));

          const showReply = (activity) => {
            typingEl.style.display = 'none';
            addMsg(activity, 'bot', assistantLabel());
            sendBtn.disabled = false;
            msgInput.disabled = false;
            msgInput.focus();
          };

          const hasRenderableAttachments = (act) => (
            Array.isArray(act && act.attachments) && act.attachments.length > 0
          );

          const isBotMessage = (act) => {
            if (act.type !== 'message') return false;
            if (!act.text && !hasRenderableAttachments(act)) return false;
            const fromRole = act.from && act.from.role;
            const fromId = act.from && act.from.id;
            if (fromRole === 'bot') return true;
            if (fromId === 'webchat_user') return false;
            return true;
          };

          if (data.activities) {
            for (const act of data.activities) {
              if (isBotMessage(act)) showReply(act);
            }
          } else if (data.type === 'message' && (data.text || hasRenderableAttachments(data))) {
            if (isBotMessage(data)) showReply(data);
          }
        } catch (e) {
          const raw = event.data;
          console.log('WS non-JSON:', raw);
          if (raw && typeof raw === 'string' && raw.length > 0) {
            typingEl.style.display = 'none';
            addMsg(raw, 'bot', assistantLabel());
            sendBtn.disabled = false;
            msgInput.disabled = false;
          }
        }
      };

      ws.onclose = (event) => {
        console.log('WebSocket closed:', event.code, event.reason);
        setStatus('err');
        addMsg('Connection lost. Reconnecting...', 'system');
        reconnectTimer = setTimeout(() => {
          if (streamUrl) {
            connectWebSocket(streamUrl);
            return;
          }
          startConversation();
        }, 3000);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !conversationId) return;

      msgInput.value = '';
      await postActivity(createBaseActivity({ text: text }), text);
    }

    function sendQuick(text) { msgInput.value = text; sendMessage(); }

    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });

    loadChatUi().finally(() => {
      if (chatUi.aistudioConfigured === false) {
        setStatus('err');
        convInfo.textContent = 'AI Studio channel is not configured on this server.';
        addMsg('AI Studio chat is not configured on this server yet. Ask an administrator to add the Cognibot connection profile and secret.', 'error');
        return;
      }
      startConversation();
    });
  </script>
