<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AE Agentic Support — Webchat</title>
  <!-- Include marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .header .status {
      font-size: 12px;
      opacity: .85;
      margin-left: auto;
    }

    .header .navlink {
      color: #fff;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, .45);
      padding: 5px 9px;
      border-radius: 12px;
      margin-left: 10px;
    }

    .header .navlink:hover {
      background: rgba(255, 255, 255, .15);
    }

    .header .session {
      font-size: 11px;
      opacity: .6;
    }

    .header .userbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 14px;
    }

    .header .userpill {
      display: none;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .18);
      font-size: 12px;
    }

    .header .logout {
      display: none;
      border: 1px solid rgba(255, 255, 255, .45);
      background: transparent;
      color: #fff;
      border-radius: 14px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .header .logout:hover {
      background: rgba(255, 255, 255, .15);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 14px;
      word-wrap: break-word;
      animation: fadeIn .25s ease;
    }

    .msg.bot {
      background: white;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .msg.user {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .msg.system {
      background: transparent;
      color: #888;
      font-size: 12px;
      text-align: center;
      align-self: center;
    }

    .msg.progress {
      background: transparent;
      color: #666;
      font-size: 13px;
      align-self: flex-start;
      padding: 6px 16px;
      font-style: italic;
      animation: fadeIn .2s ease;
    }

    .msg.progress::before {
      content: '⏳ ';
    }

    .msg.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      align-self: center;
      font-size: 13px;
    }

    .msg .label {
      font-size: 11px;
      font-weight: 600;
      opacity: .5;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* Markdown Styles */
    .msg.bot p {
      margin-bottom: 8px;
    }

    .msg.bot ul,
    .msg.bot ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }

    .msg.bot code {
      background: #f4f4f4;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: monospace;
    }

    .msg.bot pre {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border-left: 3px solid #1a73e8;
    }

    .msg.bot strong {
      font-weight: 600;
    }

    /* JSON Formatting */
    .json-block {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      background: #fafafa;
      border: 1px solid #eee;
      padding: 12px;
      border-radius: 8px;
      margin: 8px 0;
    }

    .json-key {
      color: #881391;
    }

    .json-string {
      color: #1a1aa6;
    }

    .json-number {
      color: #1c00cf;
    }

    .json-boolean {
      color: #704214;
    }

    .typing {
      align-self: flex-start;
      padding: 14px 22px;
      background: white;
      border-radius: 16px;
      display: none;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .typing span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #bbb;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce .6s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    .input-area {
      padding: 16px 24px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 12px;
    }

    .input-area select {
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      background: white;
      font-size: 13px;
      color: #333;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .input-area input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, .15);
    }

    .input-area button {
      padding: 12px 28px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }

    .input-area button:hover {
      background: #1557b0;
    }

    .input-area button:active {
      transform: scale(.97);
    }

    .input-area button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .quick-actions {
      padding: 8px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-actions button {
      padding: 6px 14px;
      border: 1.5px solid #1a73e8;
      background: white;
      color: #1a73e8;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
    }

    .quick-actions button:hover {
      background: #1a73e8;
      color: white;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .48);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }

    .auth-card {
      width: min(100%, 420px);
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 24px 48px rgba(15, 23, 42, .24);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-card h2 {
      font-size: 22px;
      color: #0f172a;
    }

    .auth-card p {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
    }

    .auth-card label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .auth-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .auth-card input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, .15);
    }

    .auth-card button {
      padding: 12px 16px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-card button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .auth-hint {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .auth-error {
      min-height: 18px;
      color: #b91c1c;
      font-size: 13px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-6px);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="dot" id="statusDot" style="background:#ffc107"></div>
    <div>
      <h1 id="chatTitle">AutomationEdge Ops Agent</h1>
      <div class="session" id="sessionInfo">Session: checking...</div>
    </div>
    <span class="status" id="statusText">Checking agent...</span>
    <div class="userbar">
      <span class="userpill" id="userPill"></span>
      <button class="logout" id="logoutBtn" type="button">Logout</button>
    </div>
    <a class="navlink" href="/admin">Control Center</a>
  </div>
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h2>Web Chat Login</h2>
      <p>Sign in with the exact AutomationEdge username. Workflow access in chat will use this username only.</p>
      <div class="auth-hint">
        Use the exact AE username with the configured default password. Username matching is case-sensitive.
      </div>
      <div>
        <label for="loginUsername">Username</label>
        <input id="loginUsername" type="text" autocomplete="username" placeholder="example: claims.user">
      </div>
      <div>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password">
      </div>
      <div class="auth-error" id="authError"></div>
      <button id="loginBtn" type="button">Login</button>
    </div>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
  <div class="quick-actions" id="quickActions"></div>
  <div class="input-area">
    <select id="roleSelect" title="Audience role">
      <option value="technical" selected>Technical</option>
      <option value="business">Business</option>
    </select>
    <input type="text" id="msgInput" placeholder="Describe your issue..." disabled>
    <button id="sendBtn" disabled onclick="sendMessage()">Send</button>
  </div>

  <script>
    const AGENT_URL = '';
    const DEFAULT_UI = {
      assistantName: 'AutomationEdge Ops Agent',
      technicalRoleLabel: 'Technical',
      businessRoleLabel: 'Business',
      inputPlaceholder: 'Describe your issue...',
      technicalWelcomeMessage: 'Agent is online. How can I help you with your AutomationEdge workflows?',
      businessWelcomeMessage: 'Agent is online. Tell me what business issue is blocked and I will guide you in plain language.',
      quickActions: [
        'Check system health and agent status',
        'Which workflows are having issues?',
        'Analyze the latest workflow failure',
        'Create a support ticket'
      ]
    };
    let chatUi = { ...DEFAULT_UI };

    const chatArea = document.getElementById('chatArea');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const roleSel = document.getElementById('roleSelect');
    const typingEl = document.getElementById('typing');
    const statusDot = document.getElementById('statusDot');
    const statusTxt = document.getElementById('statusText');
    const sessionEl = document.getElementById('sessionInfo');
    const titleEl = document.getElementById('chatTitle');
    const quickActionsEl = document.getElementById('quickActions');
    const authOverlay = document.getElementById('authOverlay');
    const loginUsernameEl = document.getElementById('loginUsername');
    const loginPasswordEl = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const authErrorEl = document.getElementById('authError');
    const userPill = document.getElementById('userPill');
    const logoutBtn = document.getElementById('logoutBtn');

    let webchatUser = null;
    let sessionId = '';
    let serverHealthy = false;
    let welcomeShown = false;

    // Configure marked.js
    marked.setOptions({
      breaks: true,
      gfm: true,
      headerIds: false,
      mangle: false
    });

    function syntaxHighlight(json) {
      if (typeof json !== 'string') {
        json = JSON.stringify(json, undefined, 2);
      }
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g, function (match) {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          if (/:$/.test(match)) {
            cls = 'json-key';
          } else {
            cls = 'json-string';
          }
        } else if (/true|false/.test(match)) {
          cls = 'json-boolean';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return '<span class="' + cls + '">' + match + '</span>';
      });
    }

    function addMsg(text, cls, label) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;

      if (label) {
        const l = document.createElement('div');
        l.className = 'label';
        l.textContent = label;
        d.appendChild(l);
      }

      const container = document.createElement('div');

      if (cls === 'bot') {
        // Check if the text is JSON
        let isJson = false;
        let jsonContent = null;
        try {
          if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
            jsonContent = JSON.parse(text);
            if (typeof jsonContent === 'object' && jsonContent !== null) {
              isJson = true;
            }
          }
        } catch (e) { }

        if (isJson) {
          const jsonPre = document.createElement('pre');
          jsonPre.className = 'json-block';
          jsonPre.innerHTML = syntaxHighlight(jsonContent);
          container.appendChild(jsonPre);
        } else {
          // Use marked.js for Markdown
          container.innerHTML = marked.parse(text);
        }
      } else {
        // User messages and errors: just text
        container.textContent = text;
        container.style.whiteSpace = 'pre-wrap';
      }

      d.appendChild(container);
      chatArea.appendChild(d);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function renderQuickActions() {
      quickActionsEl.innerHTML = '';
      (chatUi.quickActions || []).forEach((text) => {
        const btn = document.createElement('button');
        btn.textContent = text.length > 28 ? text.slice(0, 28) + '...' : text;
        btn.onclick = () => sendQuick(text);
        quickActionsEl.appendChild(btn);
      });
    }

    function applyChatUi() {
      titleEl.textContent = chatUi.assistantName || DEFAULT_UI.assistantName;
      msgInput.placeholder = chatUi.inputPlaceholder || DEFAULT_UI.inputPlaceholder;
      roleSel.innerHTML = '';
      [
        ['technical', chatUi.technicalRoleLabel || DEFAULT_UI.technicalRoleLabel],
        ['business', chatUi.businessRoleLabel || DEFAULT_UI.businessRoleLabel]
      ].forEach(([value, label], index) => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        if (index === 0) opt.selected = true;
        roleSel.appendChild(opt);
      });
      renderQuickActions();
    }

    async function loadChatUi() {
      try {
        const r = await fetch('/api/ui-config/chat', { signal: AbortSignal.timeout(4000) });
        if (!r.ok) return;
        const payload = await r.json();
        chatUi = { ...DEFAULT_UI, ...(payload || {}) };
      } catch (e) { }
      applyChatUi();
    }

    function updateComposerState() {
      const ready = serverHealthy && !!webchatUser;
      msgInput.disabled = !ready;
      sendBtn.disabled = !ready;
      roleSel.disabled = !webchatUser;
    }

    function setStatus(state) {
      const colors = { ok: '#4caf50', warn: '#ffc107', err: '#f44336' };
      const labels = { ok: 'Connected', warn: 'Checking...', err: 'Disconnected' };
      statusDot.style.background = colors[state];
      statusTxt.textContent = labels[state];
      serverHealthy = state === 'ok';
      updateComposerState();
    }

    function updateAuthUi() {
      const loggedIn = !!webchatUser;
      authOverlay.style.display = loggedIn ? 'none' : 'flex';
      userPill.style.display = loggedIn ? 'inline-flex' : 'none';
      logoutBtn.style.display = loggedIn ? 'inline-flex' : 'none';
      userPill.textContent = loggedIn ? 'User: ' + webchatUser : '';
      sessionEl.textContent = loggedIn && sessionId ? ('Session: ' + sessionId) : 'Session: login required';
      updateComposerState();
    }

    function showWelcomeIfNeeded() {
      if (!serverHealthy || !webchatUser || welcomeShown) return;
      welcomeShown = true;
      addMsg('Signed in as ' + webchatUser + '.', 'system');
      const welcome = roleSel.value === 'business'
        ? (chatUi.businessWelcomeMessage || DEFAULT_UI.businessWelcomeMessage)
        : (chatUi.technicalWelcomeMessage || DEFAULT_UI.technicalWelcomeMessage);
      addMsg(welcome, 'bot', chatUi.assistantName || DEFAULT_UI.assistantName);
    }

    async function checkHealth() {
      try {
        const r = await fetch(AGENT_URL + '/health', { signal: AbortSignal.timeout(5000) });
        if (r.ok) {
          setStatus('ok');
          showWelcomeIfNeeded();
          return;
        }
      } catch (e) { }
      setStatus('err');
      if (!chatArea.querySelector('.msg.error')) {
        addMsg('Agent server not reachable at ' + AGENT_URL + '. Make sure agent_server.py is running.', 'error');
      }
      setTimeout(checkHealth, 5000);
    }

    async function restoreAuth() {
      try {
        const r = await fetch('/api/webchat/auth/me?refresh_chat_session=1', { signal: AbortSignal.timeout(5000) });
        const payload = await r.json();
        if (payload && payload.authenticated) {
          webchatUser = payload.username || '';
          sessionId = payload.chat_session_id || '';
          welcomeShown = false;
        } else {
          webchatUser = null;
          sessionId = '';
        }
      } catch (e) {
        webchatUser = null;
        sessionId = '';
      }
      updateAuthUi();
    }

    async function login() {
      const username = loginUsernameEl.value.trim();
      const password = loginPasswordEl.value;
      authErrorEl.textContent = '';

      if (!username) {
        authErrorEl.textContent = 'Enter the exact AE username.';
        loginUsernameEl.focus();
        return;
      }

      loginBtn.disabled = true;
      try {
        const r = await fetch('/api/webchat/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const payload = await r.json();
        if (!r.ok || !payload.success) {
          authErrorEl.textContent = (payload && payload.error) || ('Login failed with HTTP ' + r.status);
          return;
        }
        webchatUser = payload.username || username;
        sessionId = payload.chat_session_id || '';
        welcomeShown = false;
        chatArea.innerHTML = '';
        updateAuthUi();
        await checkHealth();
        msgInput.focus();
      } catch (e) {
        authErrorEl.textContent = 'Login failed: ' + e.message;
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function logout() {
      try {
        await fetch('/api/webchat/auth/logout', { method: 'POST' });
      } catch (e) { }
      webchatUser = null;
      sessionId = '';
      welcomeShown = false;
      chatArea.innerHTML = '';
      authErrorEl.textContent = '';
      loginPasswordEl.value = '';
      updateAuthUi();
      loginUsernameEl.focus();
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      if (!webchatUser) {
        authErrorEl.textContent = 'Please log in first.';
        updateAuthUi();
        return;
      }
      addMsg(text, 'user', 'You');
      msgInput.value = '';
      sendBtn.disabled = true;
      msgInput.disabled = true;
      typingEl.style.display = 'block';
      chatArea.scrollTop = chatArea.scrollHeight;

      let progressEl = null;

      try {
        const r = await fetch('/api/webchat/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            user_role: roleSel.value || 'technical'
          })
        });

        if (!r.ok) {
          typingEl.style.display = 'none';
          if (r.status === 401) {
            await logout();
            authErrorEl.textContent = 'Your login session expired. Please log in again.';
          } else {
            addMsg('Agent returned HTTP ' + r.status, 'error');
          }
          sendBtn.disabled = false;
          msgInput.disabled = false;
          msgInput.focus();
          return;
        }

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let sawDoneEvent = false;

        while (true) {
          const { done, value } = await reader.read();
          if (done) {
            buffer += decoder.decode();
          } else {
            buffer += decoder.decode(value, { stream: true });
          }

          const frames = buffer.split(/\r?\n\r?\n/);
          buffer = frames.pop() || '';

          for (const frame of frames) {
            if (!frame.trim()) continue;

            let eventType = '';
            const dataLines = [];
            for (const line of frame.split(/\r?\n/)) {
              if (line.startsWith('event: ')) {
                eventType = line.slice(7).trim();
              } else if (line.startsWith('data: ')) {
                dataLines.push(line.slice(6));
              }
            }

            const raw = dataLines.join('\n');
            let parsed = raw;
            try { parsed = JSON.parse(raw); } catch { }

            if (eventType === 'progress') {
              typingEl.style.display = 'none';
              if (progressEl) progressEl.remove();
              progressEl = document.createElement('div');
              progressEl.className = 'msg progress';
              progressEl.textContent = parsed;
              chatArea.appendChild(progressEl);
              chatArea.scrollTop = chatArea.scrollHeight;
            } else if (eventType === 'done') {
              sawDoneEvent = true;
              if (progressEl) { progressEl.remove(); progressEl = null; }
              typingEl.style.display = 'none';
              addMsg(parsed || 'No response.', 'bot', chatUi.assistantName || DEFAULT_UI.assistantName);
            }
          }

          if (done) break;
        }

        if (!sawDoneEvent) {
          if (progressEl) progressEl.remove();
          typingEl.style.display = 'none';
          addMsg('The request finished but the final stream message was not received. Please try again.', 'error');
        }
      } catch (e) {
        if (progressEl) progressEl.remove();
        typingEl.style.display = 'none';
        addMsg('Request failed: ' + e.message, 'error');
      }
      sendBtn.disabled = false;
      msgInput.disabled = false;
      msgInput.focus();
    }

    function sendQuick(text) { msgInput.value = text; sendMessage(); }

    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });
    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    loginPasswordEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !loginBtn.disabled) login(); });
    loginUsernameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !loginBtn.disabled) login(); });
    roleSel.addEventListener('change', () => {
      if (chatArea.children.length === 0 && serverHealthy && webchatUser) {
        showWelcomeIfNeeded();
      }
    });

    loadChatUi().finally(async () => {
      updateAuthUi();
      await restoreAuth();
      await checkHealth();
      if (!webchatUser) loginUsernameEl.focus();
    });
  </script>
</body>

</html>
